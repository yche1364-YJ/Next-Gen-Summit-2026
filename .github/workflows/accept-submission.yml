name: Accept game submission

# Runs when a teacher adds the "approved" label to a "submission" issue.
# Only people with write/triage access to the repository can add labels,
# so this is the teacher's review step.
on:
  issues:
    types: [labeled]

# No concurrency group on purpose: GitHub keeps only ONE waiting run per group
# and cancels the others, so approving many games at once would drop some.
# Each run saves a different submissions/ folder, and the push below retries.

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  accept:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the issue and save the ZIP
        id: accept
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/accept_submission.py

      - name: Commit the submission
        if: steps.accept.outputs.ok == 'true'
        env:
          SUB_ID: ${{ steps.accept.outputs.id }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Many approvals can run at once. If someone else saved first, start
          # again from the newest version and save this game on top of it.
          pushed=false
          for attempt in $(seq 1 25); do
            if [ "$attempt" -gt 1 ]; then
              git rebase --abort 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
              GITHUB_OUTPUT=/dev/null python3 tools/accept_submission.py > /dev/null
            fi
            git add -A submissions
            if [ -n "$(git ls-files pending)" ]; then git add -A pending; fi
            if git diff --cached --quiet; then
              echo "Nothing to save."; pushed=true; break
            fi
            git commit -q -m "Add game submission ${SUB_ID} (#${ISSUE})"
            if git push -q origin HEAD:main; then pushed=true; break; fi
            sleep $(( (attempt < 6 ? attempt * 3 : 15) + RANDOM % 10 ))
          done
          $pushed || { echo "Could not save after 25 attempts"; exit 1; }

      - name: Start the gallery build
        if: steps.accept.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-gallery.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.accept.outputs.message }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"

      - name: Update labels (accepted)
        if: steps.accept.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label published --remove-label needs-fix || true

      - name: Update labels (needs a fix)
        if: steps.accept.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label needs-fix --remove-label approved --remove-label published || true
